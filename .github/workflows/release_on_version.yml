name: Release on Version Change

on:
  push:
    branches:
      - main
    paths:
      - package.json

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Compare versions
        id: version
        shell: bash
        run: |
          OLD_VERSION=$(git show "${{ github.event.before }}:package.json" | node -e "
            let d='';
            process.stdin.on('data', c => d += c);
            process.stdin.on('end', () => console.log(JSON.parse(d).version));
          ")

          NEW_VERSION=$(node -p "require('./package.json').version")

          echo "Old: $OLD_VERSION"
          echo "New: $NEW_VERSION"

          IFS='.' read -r OLD_MAJOR OLD_MINOR OLD_PATCH OLD_BUILD <<< "$OLD_VERSION"
          IFS='.' read -r NEW_MAJOR NEW_MINOR NEW_PATCH NEW_BUILD <<< "$NEW_VERSION"

          OLD_BUILD=${OLD_BUILD:-0}
          NEW_BUILD=${NEW_BUILD:-0}

          RELEASE_TYPE="none"

          if (( NEW_MAJOR != OLD_MAJOR )); then
            RELEASE_TYPE="major"
          elif (( NEW_MINOR != OLD_MINOR )); then
            RELEASE_TYPE="minor"
          elif (( NEW_PATCH != OLD_PATCH )); then
            RELEASE_TYPE="patch"
          fi

          RELEASE_VERSION="${NEW_MAJOR}.${NEW_MINOR}.${NEW_PATCH}"

          echo "type=$RELEASE_TYPE" >> "$GITHUB_OUTPUT"
          echo "version=$RELEASE_VERSION" >> "$GITHUB_OUTPUT"

          echo "Detected: $RELEASE_TYPE"

      - name: Create GitHub Release
        if: steps.version.outputs.type != 'none'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          VERSION="${{ steps.version.outputs.version }}"
          TYPE="${{ steps.version.outputs.type }}"
          TAG="v$VERSION"

          echo "Creating $TYPE release: $TAG"

          gh release create "$TAG" \
            --target "$GITHUB_SHA" \
            --title "$TAG" \
            --generate-notes
