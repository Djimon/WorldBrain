name: Release on Version Change

on:
  push:
    branches:
      - master
    paths:
      - package.json

permissions:
  contents: write

jobs:
  release:
    runs-on: windows-latest

    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - uses: actions/setup-node@v7
        with:
          node-version: "24"
          cache: npm

      - name: Compare versions
        id: version
        shell: pwsh
        run: |
          $oldJson = git show "${{ github.event.before }}:package.json" | Out-String | ConvertFrom-Json
          $newJson = Get-Content package.json -Raw | ConvertFrom-Json

          $old = $oldJson.version.Split(".")
          $new = $newJson.version.Split(".")

          while ($old.Count -lt 4) { $old += "0" }
          while ($new.Count -lt 4) { $new += "0" }

          $releaseType = "none"

          if ([int]$new[0] -ne [int]$old[0]) {
            $releaseType = "major"
          }
          elseif ([int]$new[1] -ne [int]$old[1]) {
            $releaseType = "minor"
          }
          elseif ([int]$new[2] -ne [int]$old[2]) {
            $releaseType = "patch"
          }

          $releaseVersion = "$($new[0]).$($new[1]).$($new[2])"

          "type=$releaseType" >> $env:GITHUB_OUTPUT
          "version=$releaseVersion" >> $env:GITHUB_OUTPUT

          Write-Host "Old: $($old -join '.')"
          Write-Host "New: $($new -join '.')"
          Write-Host "Detected: $releaseType"

      - name: Install Rust
        if: steps.version.outputs.type != 'none'
        uses: dtolnay/rust-toolchain@stable

      - name: Install dependencies
        if: steps.version.outputs.type != 'none'
        run: npm ci

      - name: Build Tauri NSIS installer
        if: steps.version.outputs.type != 'none'
        run: npm run desktop:build

      - name: Create GitHub Release
        if: steps.version.outputs.type != 'none'
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          $version = "${{ steps.version.outputs.version }}"
          $tag = "v$version"

          $installer = Get-ChildItem `
            "src-tauri/target/release/bundle/nsis/*.exe" |
            Select-Object -First 1

          if (-not $installer) {
            throw "NSIS installer not found."
          }

          Write-Host "Creating release $tag"
          Write-Host "Uploading $($installer.FullName)"

          gh release create $tag `
            $installer.FullName `
            --target $env:GITHUB_SHA `
            --title $tag `
            --generate-notes
