[package]
name = "worldbuilderx"
version = "0.0.27"
description = "Worlds and Beyond desktop shell"
authors = ["Worlds and Beyond Contributors"]
license = "UNLICENSED"
edition = "2021"

[lib]
name = "worldbuilderx_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2.5.1", features = [] }

[dependencies]
tauri = { version = "2.9.5", features = ["protocol-asset"] }
tauri-plugin-fs = "2"
tauri-plugin-sql = { version = "2", features = ["sqlite"] }
tauri-plugin-dialog = "2"
tauri-plugin-opener = "2"
