<!doctype html>
<html lang="de">
<head>
<meta charset="utf-8">
<title>Bloom Grau-Schleier Diagnose v2 (#320)</title>
<style>
  body{margin:0;overflow:hidden;background:#ff00ff}
  #graph{position:fixed;inset:0}
  #info{position:fixed;top:8px;left:8px;color:#fff;font-family:monospace;z-index:9;
        background:#000d;padding:10px 14px;font-size:13px;line-height:1.5;border-radius:6px}
  #info b{color:#7fd47f}
  table{border-collapse:collapse;margin-top:6px}
  td,th{border:1px solid #444;padding:2px 8px;text-align:left}
</style>
</head>
<body>
<div id="graph"></div>
<div id="info">Diagnose v2 laeuft...</div>
<script type="module">
import ForceGraph3D from '3d-force-graph';
import * as THREE from 'three';
import { UnrealBloomPass } from 'three/examples/jsm/postprocessing/UnrealBloomPass.js';
import { OutputPass } from 'three/examples/jsm/postprocessing/OutputPass.js';
import { ShaderPass } from 'three/examples/jsm/postprocessing/ShaderPass.js';

const N = 80;
const nodes = [...Array(N).keys()].map(i => ({ id: i }));
const links = [...Array(N).keys()].filter(i => i > 0).map(i => ({ source: i, target: Math.floor(Math.random() * i) }));

const fg = new ForceGraph3D(document.getElementById('graph'), {
  rendererConfig: { preserveDrawingBuffer: true },
})
  .width(innerWidth).height(innerHeight)
  .backgroundColor('#0b0d10')
  .graphData({ nodes, links });

const renderer = fg.renderer();
const composer = fg.postProcessingComposer();

// RawCopy: kopiert den Composer-Buffer 1:1 auf den Screen, OHNE jede
// Konvertierung — zeigt was WIRKLICH im RenderTarget steht.
const RawCopyShader = {
  uniforms: { tDiffuse: { value: null } },
  vertexShader: 'varying vec2 vUv; void main(){ vUv = uv; gl_Position = projectionMatrix * modelViewMatrix * vec4(position,1.0); }',
  fragmentShader: 'uniform sampler2D tDiffuse; varying vec2 vUv; void main(){ gl_FragColor = texture2D(tDiffuse, vUv); }',
};

// Decode: sRGB -> Linear (macht die eine ueberzaehlige Kodierung rueckgaengig)
const SRGBDecodeShader = {
  uniforms: { tDiffuse: { value: null } },
  vertexShader: RawCopyShader.vertexShader,
  fragmentShader: `
    uniform sampler2D tDiffuse; varying vec2 vUv;
    vec3 srgbToLinear(vec3 c){
      return mix(c / 12.92, pow((c + 0.055) / 1.055, vec3(2.4)), step(vec3(0.04045), c));
    }
    void main(){
      vec4 t = texture2D(tDiffuse, vUv);
      gl_FragColor = vec4(srgbToLinear(t.rgb), t.a);
    }`,
};

const passes = [];
function clearPasses() {
  for (const p of passes) { composer.removePass(p); p.dispose?.(); }
  passes.length = 0;
}
function addPass(p) { composer.addPass(p); passes.push(p); }

function apply(cfg) {
  clearPasses();
  renderer.toneMapping = cfg.aces ? THREE.ACESFilmicToneMapping : THREE.NoToneMapping;
  if (cfg.decode) addPass(new ShaderPass(SRGBDecodeShader));
  if (cfg.bloom) addPass(new UnrealBloomPass(new THREE.Vector2(innerWidth, innerHeight), cfg.strength, 0.5, 0.2));
  if (cfg.rawCopy) addPass(new ShaderPass(RawCopyShader));
  if (cfg.output) addPass(new OutputPass());
}

function readBg() {
  const gl = renderer.getContext();
  const px = new Uint8Array(4);
  gl.readPixels(10, 10, 1, 1, gl.RGBA, gl.UNSIGNED_BYTE, px);
  return Array.from(px);
}

const PHASES = [
  { name: 'A: Bloom AUS (Referenz, soll 11,13,16)',           },
  { name: 'R: RT-Inhalt roh (11=sRGB im RT / ~1=linear im RT)', bloom: true, strength: 0, rawCopy: true },
  { name: 'G: Decode->Bloom0->Output, ohne ACES (soll 11,13,16)', decode: true, bloom: true, strength: 0, output: true },
  { name: 'H: wie G mit ACES',                                  decode: true, bloom: true, strength: 0, output: true, aces: true },
  { name: 'E: Fix-Kette, ACES, Strength 1.55 (finaler Look)',   decode: true, bloom: true, strength: 1.55, output: true, aces: true },
];

const results = [];
const info = document.getElementById('info');
const wait = (ms) => new Promise(r => setTimeout(r, ms));

function renderTable(running) {
  let html = '<b>#320 Bloom-Diagnose v2</b> — Referenz #0b0d10 = rgb(11,13,16)<br>';
  html += '<table><tr><th>Phase</th><th>Hintergrund-Pixel RGBA</th></tr>';
  for (const r of results) html += `<tr><td>${r.name}</td><td>${r.px.join(', ')}</td></tr>`;
  html += '</table>';
  html += running ? `<br>laeuft: ${running}...` : '<br><b>FERTIG — bitte Screenshot.</b><br>Phase E bleibt aktiv: ist der Bloom-Look noch wie gewuenscht?';
  info.innerHTML = html;
}

(async () => {
  await wait(2500);
  for (const phase of PHASES) {
    renderTable(phase.name);
    apply(phase);
    await wait(1500);
    results.push({ name: phase.name, px: readBg() });
    renderTable(null);
  }
  renderTable(null);
})();
</script>
</body>
</html>
