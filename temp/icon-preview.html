<!DOCTYPE html>
<html lang="de">
<head>
<meta charset="utf-8">
<title>Core Status-Chip Icons</title>
<style>
  body { margin:0; background:#15171c; color:#e6e8eb; font-family: system-ui, sans-serif; }
  h1 { font-weight:500; font-size:18px; padding:20px 24px 4px; }
  p.sub { color:#9aa1ac; font-size:13px; padding:0 24px; margin:0 0 8px; }
  .grid { display:grid; grid-template-columns:repeat(4,1fr); gap:14px; padding:20px 24px; max-width:720px; }
  .cell { display:flex; flex-direction:column; align-items:center; gap:10px; padding:16px; border:1px solid #2a2f3a; border-radius:12px; background:#1b1e24; }
  .cell svg { color:var(--icon-color,#fff); }
  .lbl { font-size:12px; color:#9aa1ac; }
  .toolbar { display:flex; align-items:center; gap:10px; padding:8px 24px 0; }
  .toolbar label { font-size:13px; color:#9aa1ac; }
  .toolbar input[type=color] { width:42px; height:28px; padding:0; border:1px solid #2a2f3a; border-radius:6px; background:#1b1e24; cursor:pointer; }
  .toolbar button { font-size:12px; color:#9aa1ac; background:#1b1e24; border:1px solid #2a2f3a; border-radius:6px; padding:5px 10px; cursor:pointer; }
</style>
</head>
<body>
<h1>Core Status-Chip Icons — slim (14)</h1>
<p class="sub">weiss auf dunkel, currentColor (per Chip-Farbe tintbar)</p>
<div class="toolbar">
  <label for="tint">Icon-Farbe</label>
  <input type="color" id="tint" value="#ffffff">
  <button type="button" id="reset">Weiss</button>
</div>
<div class="grid">
  <div class="cell"><svg width="42" height="42" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"><path d="M12 3a6 6 0 0 0-4 10.4V16h8v-2.6A6 6 0 0 0 12 3Z"/><circle cx="9.6" cy="10" r=".9"/><circle cx="14.4" cy="10" r=".9"/></svg><div class="lbl">poisoned</div></div>
  <div class="cell"><svg width="42" height="42" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"><path d="M12 3 6 5.2v5.3c0 4.4 3 7.4 6 8.9 3-1.5 6-4.5 6-8.9V5.2L12 3Z"/><path d="M12.5 7.5 10.5 12h3L11 16"/></svg><div class="lbl">armour-break</div></div>
  <div class="cell"><svg width="42" height="42" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"><g transform="translate(12 12) scale(1.1) translate(-12 -12)"><path d="M12 4c3 4 5 6.6 5 9a5 5 0 0 1-10 0c0-2.4 2-5 5-9Z"/></g></svg><div class="lbl">bleeding</div></div>
  <div class="cell"><svg width="42" height="42" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"><path d="M5 17h2.5l-2.5 2.5h2.5"/><path d="M9 11h3.5l-3.5 3.5h3.5"/><path d="M14 4h5l-5 5h5"/></svg><div class="lbl">asleep</div></div>
  <div class="cell"><svg width="42" height="42" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"><path d="M5 12A7 7 0 0 1 19 12A5.6 5.6 0 0 1 7.8 12A4.2 4.2 0 0 1 16.2 12A2.8 2.8 0 0 1 10.6 12A1.4 1.4 0 0 1 13.4 12"/></svg><div class="lbl">stunned</div></div>
  <div class="cell"><svg width="42" height="42" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"><path d="M3.5 12S7 6.5 12 6.5s8.5 5.5 8.5 5.5-3.5 5.5-8.5 5.5S3.5 12 3.5 12Z"/><circle cx="12" cy="12" r="2.2"/><path d="M4 4 20 20"/></svg><div class="lbl">blinded</div></div>
  <div class="cell"><svg width="42" height="42" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"><path d="M12 3v9"/><path d="m8 8 4 4 4-4"/><path d="M4 20h16"/></svg><div class="lbl">prone</div></div>
  <div class="cell"><svg width="42" height="42" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"><g transform="rotate(-35 12 12)"><rect x="8.5" y="3.5" width="7" height="9" rx="3.5"/><rect x="8.5" y="9.5" width="7" height="9" rx="3.5"/></g></svg><div class="lbl">restrained</div></div>
  <div class="cell"><svg width="42" height="42" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="12" r="8.5"/><circle cx="9" cy="10" r=".9"/><circle cx="15" cy="10" r=".9"/><circle cx="12" cy="15.5" r="1.8"/></svg><div class="lbl">frightened</div></div>
  <div class="cell"><svg width="42" height="42" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"><path d="M6 20V12a6 6 0 0 1 12 0v8l-2.4-1.8-2.4 1.8-2.4-1.8-2.4 1.8Z" stroke-dasharray="2.5 3"/><circle cx="10" cy="11" r="1.1"/><circle cx="14" cy="11" r="1.1"/></svg><div class="lbl">invisible</div></div>
  <div class="cell"><svg width="42" height="42" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"><g transform="translate(12 12) scale(1.26) translate(-12 -12) translate(0 3)"><path d="M12 3c1 3 4 4 4 8a4 4 0 0 1-8 0c0-1.8.9-2.6 1.6-3.4.4 1 1.4 1.4 1.4 1.4C11.6 7 11 5 12 3Z"/></g></svg><div class="lbl">on-fire</div></div>
  <div class="cell"><svg width="42" height="42" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"><path d="M6 21V11a6 6 0 0 1 12 0v10Z"/><path d="M6 21h12"/><path d="M12 6v5m-2.5-2.5h5"/></svg><div class="lbl">dead</div></div>
  <div class="cell"><svg width="42" height="42" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"><path d="M6 6l6 6-6 6"/><path d="M13 6l6 6-6 6"/></svg><div class="lbl">hasted</div></div>
  <div class="cell"><svg width="42" height="42" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"><g transform="translate(12 12) scale(0.9) translate(-12 -12)"><circle cx="12" cy="12" r="8.5"/><path d="M12 7.5V12l3.5 2"/></g></svg><div class="lbl">slowed</div></div>
</div>
<script>
  const root = document.documentElement;
  const tint = document.getElementById('tint');
  const apply = c => root.style.setProperty('--icon-color', c);
  tint.addEventListener('input', e => apply(e.target.value));
  document.getElementById('reset').addEventListener('click', () => { tint.value = '#ffffff'; apply('#ffffff'); });
</script>
</body>
</html>
